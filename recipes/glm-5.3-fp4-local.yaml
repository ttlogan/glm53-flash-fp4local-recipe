# GLM-5.3-Flash-FP4-Local — B12X recipe (eugr run-recipe format)
# For a 2-node DGX Spark / GX10 (GB10, sm_121a). Model = nvidia QAD FP4.

recipe_version: "1"
name: GLM-5.3-Flash-FP4-Local
description: vLLM B12X serving nvidia/GLM-5.3-Flash-FP4-Local on a dual DGX Spark/GX10 cluster

model: nvidia/GLM-5.3-Flash-FP4-Local
# Actual image on the cluster (the deployed/launcher path uses this same image).
container: docker.io/eugr/spark-vllm-b12x@sha256:03a956544e9f9b4b7ba91690469fbe7848bdbef29a7d2e0f5788368467bb3595

build_args:
  - --exp-b12x

cluster_only: true

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  decode_context_parallel: 1
  block_size: 256
  max_model_len: 1048576
  max_num_seqs: 4
  max_num_batched_tokens: 4096
  num_speculative_tokens: 3
  gpu_memory_utilization: 0.87

env:
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  B12X_POLICY_MODE: "auto"
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  B12X_W4A16_A4_PREFILL: "1"
  INSTANTTENSOR_BACKEND: "BUFFERED"
  INSTANTTENSOR_BUFFER_SIZE: "67108864"
  INSTANTTENSOR_CHUNK_SIZE: "8388608"
  INSTANTTENSOR_CONCURRENCY: "1"
  INSTANTTENSOR_IO_DEPTH: "3"

command: |
  vllm serve nvidia/GLM-5.3-Flash-FP4-Local \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --decode-context-parallel-size {decode_context_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --attention-backend B12X \
    --block-size {block_size} \
    --moe-backend b12x \
    --linear-backend b12x \
    --no-enable-flashinfer-autotune \
    --load-format instanttensor \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"moe_backend":"b12x","attention_backend":"B12X"}}' \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --served-model-name glm-5.3-flash-fp4-local \
    --gpu-memory-utilization {gpu_memory_utilization}
